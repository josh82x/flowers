<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Flower Delivery</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="A special flower delivery just for you">
</head>
<body>
    <div class="container">
        <header>
            <h1>A Special Delivery Just For You</h1>
            <p class="message">Someone special wanted to send you these flowers. Click the button to see them bloom!</p>
        </header>
        
        <main>
            <div class="flower-container" id="flowerContainer">
                <!-- Flowers will be added here dynamically -->
            </div>
            
            <div class="button-container">
                <button id="bloomButton" class="bloom-button">Receive Your Flowers</button>
            </div>
        </main>
        
        <footer>
            <p class="footer-text">Made with ❤️ just for you</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
